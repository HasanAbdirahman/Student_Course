apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: student-course-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: student-course.availability
      rules:
        # Alert when a pod has restarted more than 3 times in 15 minutes
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace=~"backend|frontend"
            }[15m]) > 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last 15 minutes."

        # Alert when a pod has been unavailable for more than 2 minutes
        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{
              namespace=~"backend|frontend",
              condition="true"
            } == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been unavailable for more than 2 minutes."

    - name: student-course.errors
      rules:
        # Alert when more than 5% of backend requests are 5xx errors
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m])) > 0.05
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate on backend"
            description: "More than 5% of backend requests are returning 5xx errors over the last 5 minutes (current: {{ $value | humanizePercentage }})."

        # Alert when p95 request latency exceeds 2 seconds
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
            ) > 2
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "High p95 latency on backend"
            description: "95th percentile request latency is above 2 seconds (current: {{ $value | humanizeDuration }})."
