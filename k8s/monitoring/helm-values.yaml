# Helm values for kube-prometheus-stack
#
# Install / upgrade with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f k8s/monitoring/helm-values.yaml

grafana:
  enabled: true
  admin:
    # Grafana password is stored in a Kubernetes secret, not hardcoded here.
    # Before running helm, create the secret once in your cluster:
    #
    #   kubectl create secret generic grafana-admin-secret \
    #     --namespace monitoring \
    #     --from-literal=admin-password='YourStrongPassword123'
    #
    # Grafana will read the password from that secret automatically.
    # Never put the real password in this file — it gets committed to git.
    existingSecret: grafana-admin-secret
    passwordKey: admin-password
  service:
    type: LoadBalancer   # exposes Grafana externally; use ClusterIP + port-forward locally

prometheus:
  prometheusSpec:
    # Scrape ServiceMonitors from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}

    # Retain 15 days of metrics
    retention: 15d

    # Persist metrics across pod restarts
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "hasanabdirahman1999@gmail.com"
      smtp_auth_username: "hasanabdirahman1999@gmail.com"
      # IMPORTANT: Do NOT paste the real password here — this file is committed to git.
      # The real password is passed via --set at deploy time (see helm command at the top).
      # Leaving this as a placeholder is intentional.
      smtp_auth_password: "REPLACE_WITH_GMAIL_APP_PASSWORD"
      smtp_require_tls: true
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: email
    receivers:
      - name: email
        email_configs:
          - to: "hasanabdirahman1999@gmail.com"
            send_resolved: true   # also sends an email when the alert clears

# ─────────────────────────────────────────────────────────────
# HOW TO GET THE GMAIL APP PASSWORD AND USE IT CORRECTLY
# ─────────────────────────────────────────────────────────────
#
# Gmail does not allow your normal account password here.
# You must generate a special App Password. Here is the full process:
#
# STEP 1 — Generate the App Password (do this once):
#   1. Go to: myaccount.google.com/apppasswords
#   2. Type a name in the box e.g. "AlertManager"
#   3. Click Create
#   4. Google shows you 16 characters like: abcd efgh ijkl mnop
#   5. Copy it WITHOUT spaces → abcdefghijklmnop
#   6. Save it somewhere safe (password manager) — Google only shows it once
#
# STEP 2 — DO NOT paste it into this file.
#   Pasting it here means it gets committed to GitHub and is publicly visible.
#   Anyone who sees your repo can use it to send emails as you.
#
# STEP 3 — Pass it via --set when running helm:
#
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f k8s/monitoring/helm-values.yaml \
#     --set alertmanager.config.global.smtp_auth_password="abcdefghijklmnop"
#
#   The --set flag injects the password at deploy time without touching this file.
#
# STEP 4 — If you accidentally committed the real password:
#   1. Go to myaccount.google.com/apppasswords and DELETE that app password
#   2. Generate a new one following STEP 1 again
#   3. Use the new one in the helm command above
#
# After deploying, whenever an alert fires (crash loop, high errors, high latency)
# you will get an email at hasanabdirahman1999@gmail.com.
# You will also get a follow-up email when the issue resolves.

