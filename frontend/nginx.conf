server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header X-XSS-Protection "1; mode=block"                     always;
    add_header Referrer-Policy "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://backend-service:5000;" always;

    # React router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't expose nginx version in error pages
    server_tokens off;
}
